# Memory for the Minecraft decompilation step.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47.4,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Ars Nouveau (the only mod dependency)
# Maven artifact version on maven.blamejared.com (4.12.7 + CI build number).
# 4.12.7.264 is the only 4.12.7 build published; pinned for reproducible builds.
ars_version=4.12.7.264
# Version range checked by Forge at load time.
ars_version_range=[4.12.7,)

## Mod
mod_id=ars_backports
mod_name=Ars Backports
mod_license=LGPL-3.0-only
mod_version=0.1.0
mod_group_id=fr.lucas.arsbackports
mod_authors=lucasmettetal
mod_description=Backports selected Ars Nouveau 1.21.1 features (starting with the Enchanter's Gauntlet) to Ars Nouveau 4.12.7 on Minecraft 1.20.1.
